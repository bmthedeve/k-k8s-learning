apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: crash-demo
  template:
    metadata:
      labels:
        app: crash-demo

    spec:
      containers:
        - name: crash-demo
          image: nginx:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting application..."
              echo "Oops! Something went wrong."
              exit 1
          ports:
            - containerPort: 80
