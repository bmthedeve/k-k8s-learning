apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
        - name: oom-demo
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              print("Starting memory leak...")
              data = []
              while True:
                  data.append("A" * 1024 * 1024)   # Allocate 1 MB continuously
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
