apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-demo

spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness-demo
  template:
    metadata:
      labels:
        app: readiness-demo

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health      # Intentional mistake
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
